define Heizung_HKR2_1W DOIF ## 1-Wire-Fuehler Heizkreis 2 -> Heizung_HKR2 (eBUS-Werte liefert EBUSFUNC direkt)\
## Fehler: RPI_1Wire setzt state ohne Event, Lesefehler erzeugen aber "failures: n"\
   (["^1W_HKR2_Vorlauf$:^temperature:"])   (setreading Heizung_HKR2 VL_Ist [1W_HKR2_Vorlauf:temperature])\
DOELSEIF (["^1W_HKR2_Vorlauf$:^failures:"])     (setreading Heizung_HKR2 VL_Ist Fehler)\
DOELSEIF (["^1W_HKR2_Ruecklauf$:^temperature:"]) (setreading Heizung_HKR2 RL_Ist [1W_HKR2_Ruecklauf:temperature])\
DOELSEIF (["^1W_HKR2_Ruecklauf$:^failures:"])   (setreading Heizung_HKR2 RL_Ist Fehler)
attr Heizung_HKR2_1W do always
attr Heizung_HKR2_1W room Heizung
